<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  table {
    border-collapse: collapse;
    width: 400px;
    font-family: Arial, sans-serif;
  }
  th, td {
    border: 1px solid #999;
    padding: 8px 12px;
    text-align: left;
  }
  th {
    background-color: #2c3e50;
    color: white;
  }
  tr:nth-child(even) {
    background-color: #f2f2f2;
  }
  button {
    margin-bottom: 10px;
    padding: 6px 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div><button id="botaoCarregar">Carregando cervejas...</button></div>
<div id="cervejasDiv"></div>

<script>
  let cervejas = [
    { name: "Guiness",    alcohol: "10%", style: "Imperial Stout", ibu: "35" },
    { name: "Desperados", alcohol: "6%",  style: "Lager",          ibu: "18" },
    { name: "Becks",      alcohol: "5%",  style: "APA",            ibu: "25" }
  ]

  const carregarDiv = (
    cs,
    elementId = "cervejasDiv",
    headers = ["Nome", "Álcool", "Estilo", "Amargor"],
    props = ["name", "alcohol", "style", "ibu"]
  ) => {
    const div = document.getElementById(elementId)

    const headerHtml = `<tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr>`

    const linhasHtml = cs.map(item => {
      const celulas = props.map(p => `<td>${item[p]}</td>`).join("")
      return `<tr>${celulas}</tr>`
    }).join("\n")

    div.innerHTML = `<table>${headerHtml}${linhasHtml}</table>`
  }

  let botao = document.getElementById("botaoCarregar")
  botao.addEventListener("click", () => carregarDiv(cervejas))
</script>

</body>
</html>
