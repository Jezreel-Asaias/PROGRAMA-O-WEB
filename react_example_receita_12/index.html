<!DOCTYPE html>
<html>
<head>
<title>ReceitaReact - 3</title>
</head>
<body>
<div id="app"></div>

<script src="libs/react.js"></script>
<script src="libs/react-dom.js"></script>
<script src="libs/babel.js"></script>

<script type="text/babel">

const TabelaBebidas = ({titulo, cabecalhos, linhas}) => {
    return (
        <div>
            <h1>{titulo}</h1>
            <table id="tabela" border="1">
                <thead>
                    <tr>
                        {cabecalhos.map( (c, i) => <th key={i}>{c}</th> )}
                    </tr>
                </thead>
                <tbody>
                    {linhas.map( (linha, i) =>
                        <tr key={i}>
                            {linha.map( (valor, j) => <td key={j}>{valor}</td> )}
                        </tr>
                    )}
                </tbody>
            </table>
        </div>
    )
}

const valoresCabecalhos = ["Nome", "Marca", "Teor Alcoólico"]

const valoresLinhas = [
    ["Havana", "Engenho Anísio Santiago", "40%"],
    ["Ypióca", "Ypióca", "40%"],
    ["51", "Müller", "39%"]
]

ReactDOM.render(
    <TabelaBebidas titulo="minha tabela de cana" cabecalhos={valoresCabecalhos} linhas={valoresLinhas}/>
,
document.getElementById("app"))

</script>
</body>
</html>
